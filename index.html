<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Amazone Ads Data</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b1f;color:#e8ecff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  main{max-width:420px}
  h1{margin:0 0 8px;font-size:1.6rem;letter-spacing:.08em}
  h1 b{display:block;color:#e7b94c;font-size:.9rem;letter-spacing:.3em;margin-top:4px}
  p{color:#b9c8f5;line-height:1.5}
  #st{margin-top:18px;padding:12px;border:1px solid #2a3a7a;border-radius:12px;font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>AMAZONE<b>ADS DATA</b></h1>
  <p>Dépôt de données du jeu : il contient <code>ads.json</code> et les médias des panneaux LED. Cette page ne sert qu'à vérifier que tout est en ligne.</p>
  <div id="st">Vérification de ads.json…</div>
</main>
<script>
fetch("ads.json?_="+Date.now()).then(function(r){
  if(!r.ok) throw new Error(r.status);
  return r.json();
}).then(function(j){
  var d = j.updatedAt ? new Date(j.updatedAt).toLocaleString("fr-FR") : "date inconnue";
  document.getElementById("st").textContent = "ads.json en ligne · dernière publication : " + d;
}).catch(function(){
  document.getElementById("st").textContent = "Pas encore de ads.json : il sera créé à la première publication du gestionnaire.";
});
</script>
</body>
</html>
